# 本地开发数据源(profile: local)
# 使用方式(需先执行 src/main/resources/sql/init-local-mysql.sql 初始化本地 MySQL):
#   .\run-local.cmd -s ..\maven-proxy-settings.xml spring-boot:run
# (run-local.cmd 通过 SPRING_PROFILES_ACTIVE=local 激活本 profile)
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/travelist_dev?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: travelist
    password: travelist
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
